name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        exclude:
          - php: '8.2'
            laravel: '13'
        include:
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-L${{ matrix.laravel }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-L${{ matrix.laravel }}-

      - name: Install dependencies
        run: |
          if [ "${{ matrix.laravel }}" = "11" ]; then export COMPOSER_NO_SECURITY_BLOCKING=1; fi
          composer require "orchestra/testbench:${{ matrix.testbench }}" --no-update --dev
          composer update --prefer-dist --no-progress

      - name: Audit supported dependency graph
        if: matrix.php == '8.5' && matrix.laravel == '12'
        run: composer audit

      - name: PHPStan
        run: vendor/bin/phpstan analyse

      - name: PHPUnit
        run: vendor/bin/phpunit
